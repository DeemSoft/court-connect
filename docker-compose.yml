services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - courtconnect-data:/var/opt/mssql
    networks:
      - courtconnect
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CourtConnect;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Identity__DevelopmentPassword: ${IDENTITY_DEVELOPMENT_PASSWORD:?Define IDENTITY_DEVELOPMENT_PASSWORD in .env}
    ports:
      - "5258:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - courtconnect
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      CourtConnectApi__BaseUrl: http://api:8080/
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - courtconnect

volumes:
  courtconnect-data:

networks:
  courtconnect:
    driver: bridge
