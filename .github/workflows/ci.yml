name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar .NET desde global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore CourtConnect.slnx

      - name: Compilar la solución
        run: dotnet build CourtConnect.slnx --no-restore

      - name: Ejecutar pruebas unitarias y de integración
        run: dotnet test CourtConnect.slnx --no-build
