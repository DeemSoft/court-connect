name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java para SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Configurar .NET desde global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore CourtConnect.slnx

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Comprobar configuración de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta el secret SONAR_TOKEN."; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Falta la variable SONAR_ORGANIZATION."; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Falta la variable SONAR_PROJECT_KEY."; exit 1; }

      - name: Iniciar análisis de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**"

      - name: Compilar la solución
        run: dotnet build CourtConnect.slnx --no-restore

      - name: Ejecutar pruebas y recoger cobertura OpenCover
        run: dotnet test CourtConnect.slnx --no-build --collect:"XPlat Code Coverage;Format=opencover"

      - name: Finalizar análisis de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
